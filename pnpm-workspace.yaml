allowBuilds:
  unrs-resolver: false

autoInstallPeers: false

minimumReleaseAge: 720

minimumReleaseAgeExclude:
  - "@codemod-utils/*"
  - "@ember-intl/*"
  - "@ijlee2-frontend-configs/*"
  - "ember-intl"

packages:
  - "blueprints/v2-addon"
  - "ember-test"
  - "my-addon"
  - "my-app"

publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*stylelint*"

resolvePeersFromWorkspaceRoot: false

verifyDepsBeforeRun: "warn"
